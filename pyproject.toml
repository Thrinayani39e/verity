[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.1.0"
description = "Agentic memory layer for concurrent claims agents, built on CockroachDB + AWS Bedrock."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
